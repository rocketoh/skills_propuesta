<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 660" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrowDown" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Card -->
  <rect x="8" y="8" width="1224" height="644" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Title -->
  <text x="620" y="52" text-anchor="middle" font-size="28" font-weight="700" fill="#1f2933">Cómo se aprovisiona un proyecto con skills</text>
  <text x="620" y="82" text-anchor="middle" font-size="15" fill="#616e7c">El catálogo crece a N skills; cada proyecto copia solo las que necesita y que están listas.</text>

  <!-- ===================== LEFT: CATÁLOGO ===================== -->
  <rect x="48" y="110" width="360" height="488" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="70" y="146" font-size="17" font-weight="700" fill="#2563eb">CATÁLOGO (repo clonado)</text>
  <text x="70" y="170" font-size="13" fill="#616e7c">skills-repo/skills/</text>

  <!-- skill row 1: experimental -->
  <rect x="70" y="186" width="316" height="44" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="84" y="213" font-size="13" font-weight="600" fill="#1f2933">adf-validate-pipeline</text>
  <rect x="278" y="196" width="96" height="24" rx="12" fill="#fdecc8"/>
  <text x="326" y="212" text-anchor="middle" font-size="11" font-weight="700" fill="#92610a">experimental</text>

  <!-- skill row 2: stable -->
  <rect x="70" y="240" width="316" height="44" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="84" y="267" font-size="13" font-weight="600" fill="#1f2933">sql-format-query</text>
  <rect x="310" y="250" width="64" height="24" rx="12" fill="#d7f0df"/>
  <text x="342" y="266" text-anchor="middle" font-size="11" font-weight="700" fill="#0b6b3a">stable</text>

  <!-- skill row 3: production -->
  <rect x="70" y="294" width="316" height="44" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="84" y="321" font-size="13" font-weight="600" fill="#1f2933">synapse-generate-notebook</text>
  <rect x="288" y="304" width="86" height="24" rx="12" fill="#d7f0df"/>
  <text x="331" y="320" text-anchor="middle" font-size="11" font-weight="700" fill="#0b6b3a">production</text>

  <text x="70" y="382" font-size="13" fill="#616e7c">El estado (status) vive dentro de</text>
  <text x="70" y="402" font-size="13" fill="#616e7c">cada SKILL.md — no en carpetas</text>
  <text x="70" y="422" font-size="13" fill="#616e7c">separadas por etapa.</text>

  <!-- ===================== MIDDLE: FLOW ===================== -->
  <!-- main arrow -->
  <line x1="408" y1="312" x2="828" y2="312" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <!-- pill -->
  <rect x="505" y="286" width="230" height="52" rx="26" fill="#1f2933"/>
  <text x="620" y="318" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">sync-skills.sh</text>
  <text x="620" y="362" text-anchor="middle" font-size="12.5" fill="#616e7c">lee skills.txt · verifica status</text>
  <text x="620" y="380" text-anchor="middle" font-size="12.5" fill="#616e7c">· copia solo las aptas</text>

  <!-- ===================== RIGHT: PROYECTO ===================== -->
  <rect x="832" y="110" width="360" height="488" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="854" y="146" font-size="17" font-weight="700" fill="#7c3aed">TU PROYECTO</text>

  <!-- skills.txt -->
  <text x="854" y="176" font-size="13" font-weight="600" fill="#334155">skills.txt  (lo que el proyecto pide)</text>
  <rect x="854" y="186" width="316" height="106" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="868" y="212" font-size="13" fill="#1f2933">adf-validate-pipeline</text>
  <text x="868" y="240" font-size="13" fill="#1f2933">sql-format-query</text>
  <text x="868" y="268" font-size="13" fill="#1f2933">synapse-generate-notebook</text>

  <!-- down arrow -->
  <line x1="1012" y1="298" x2="1012" y2="338" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrowDown)"/>

  <!-- .claude/skills -->
  <text x="854" y="364" font-size="13" font-weight="600" fill="#334155">.claude/skills/  (lo que llega)</text>
  <rect x="854" y="374" width="316" height="82" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="868" y="402" font-size="13" font-weight="600" fill="#0b6b3a">✓ sql-format-query</text>
  <text x="868" y="432" font-size="13" font-weight="600" fill="#0b6b3a">✓ synapse-generate-notebook</text>

  <!-- omitted note -->
  <rect x="854" y="474" width="316" height="68" rx="8" fill="#fdecc8" stroke="#f4d58a"/>
  <text x="868" y="500" font-size="12.5" font-weight="700" fill="#92610a">adf-validate-pipeline NO se copió</text>
  <text x="868" y="520" font-size="12.5" fill="#92610a">Está en experimental: el script la</text>
  <text x="868" y="536" font-size="12.5" fill="#92610a">omite y avisa. Protege al proyecto.</text>

  <!-- footer caption -->
  <text x="620" y="630" text-anchor="middle" font-size="13" fill="#94a3b8">Una sola fuente de verdad (el catálogo) · cada proyecto declara lo suyo en skills.txt · el status decide qué está listo.</text>
</svg>
